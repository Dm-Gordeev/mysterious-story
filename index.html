<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee;
      font-family: system-ui, sans-serif; overflow: hidden; }
    #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #start { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; background: #111; z-index: 10; }
    #start button { font-size: 24px; padding: 16px 40px; border-radius: 12px;
      border: none; background: #e8b04b; color: #222; cursor: pointer; }
    #hud { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 5;
      display: flex; justify-content: space-between; font-size: 14px; opacity: .85; }
    #reticle { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 50vw; height: 50vh; border: 2px dashed #e8b04b; border-radius: 12px;
      z-index: 4; pointer-events: none; display: none; }
    #reticle span { position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%);
      white-space: nowrap; font-size: 13px; background: rgba(0,0,0,.6); padding: 2px 8px;
      border-radius: 6px; }
    #overlay { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      z-index: 5; background: rgba(0,0,0,.78); border: 2px solid #e8b04b;
      border-radius: 16px; padding: 18px 28px; font-size: 20px; text-align: center;
      display: none; max-width: 86vw; }
    #overlay small { display: block; margin-top: 8px; font-size: 13px; color: #aaa; }
    #ghost { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      z-index: 4; pointer-events: none; display: none; opacity: .9;
      border: 2px dashed #e8b04b; border-radius: 6px; }
    #picker { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
      display: flex; flex-wrap: wrap; gap: 6px; padding: 10px;
      background: rgba(0,0,0,.55); justify-content: center; }
    #picker button { font-size: 13px; padding: 8px 12px; border-radius: 999px;
      border: 1px solid #555; background: #222; color: #ccc; cursor: pointer; }
    #picker button.on { background: #e8b04b; color: #222; border-color: #e8b04b; }
  </style>
</head>
<body>
  <video id="video" playsinline muted></video>

  <div id="start">
    <div>Наведи камеру на любую из картинок-свидетелей</div>
    <button id="startBtn">Начать</button>
  </div>

  <div id="hud">
    <span id="status">—</span>
    <span id="frames">—</span>
  </div>

  <div id="overlay">
    <b id="overlayName">—</b>
  </div>

  <div id="reticle"><span>держи картинку здесь</span></div>

  <img id="ghost" alt="">

  <div id="picker" style="display:none;"></div>
