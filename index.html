<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Дело Ночного Кого-то</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee;
      font-family: system-ui, sans-serif; overflow: hidden; }
    #video { position: fixed; top: 96px; left: 50%; transform: translateX(-50%);
      width: min(78vw, 360px); aspect-ratio: 1 / 1; object-fit: cover;
      border-radius: 16px; border: 2px solid #666; background: #000; }
    #dim { position: fixed; top: 96px; left: 50%; transform: translateX(-50%);
      width: min(78vw, 360px); aspect-ratio: 1 / 1; border-radius: 16px;
      background: rgba(0,0,0,.78); z-index: 3; display: none;
      align-items: center; justify-content: center; font-size: 20px; text-align: center; padding: 0 20px; }
    #gearBtn { background: none; border: 1px solid #555; color: #ccc; border-radius: 8px;
      font-size: 16px; padding: 2px 8px; cursor: pointer; }
    #settingsPop { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      z-index: 50; background: #222; border: 1px solid #555; border-radius: 14px;
      padding: 18px 22px; display: none; flex-direction: column; gap: 12px;
      align-items: center; min-width: 220px; }
    #settingsPop button { font-size: 15px; padding: 10px 20px; border-radius: 10px;
      border: 1px solid #555; background: #333; color: #eee; cursor: pointer; }
    #resetBtn { background: #7a2323 !important; }
    #hud { position: fixed; top: 8px; left: 12px; right: 12px; z-index: 6;
      display: flex; justify-content: space-between; font-size: 13px; opacity: .8; }
    #nav { position: fixed; top: 36px; left: 0; right: 0; z-index: 6; display: flex;
      gap: 4px; padding: 6px 8px; overflow-x: auto; justify-content: center; }
    #nav button { flex: 0 0 auto; font-size: 12px; padding: 5px 9px; border-radius: 999px;
      border: 1px solid #555; background: rgba(20,20,20,.75); color: #ccc; cursor: pointer; }
    #nav button.on { background: #e8b04b; color: #222; border-color: #e8b04b; }
    #nav button.locked { opacity: .35; }
    #nav button:disabled { opacity: .35; }
    #panel { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
      z-index: 5; width: min(92vw, 480px); display: flex; flex-direction: column;
      gap: 14px; align-items: center; }
    #hint { text-align: center; font-size: 18px; background: rgba(0,0,0,.65);
      border-radius: 14px; padding: 14px 20px; }
    #playBtn { font-size: 22px; padding: 14px 44px; border-radius: 14px; border: none;
      background: #e8b04b; color: #222; cursor: pointer; }
    #playBtn:disabled { opacity: .45; }
    #wordWrap { display: flex; flex-direction: column; gap: 10px; align-items: center; }
    #cells { display: flex; gap: 8px; }
    .cell { width: 38px; height: 48px; border: 2px solid #e8b04b; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 26px;
      background: rgba(0,0,0,.6); text-transform: uppercase; }
    #wordInput { width: 220px; font-size: 24px; text-align: center; letter-spacing: 6px;
      padding: 10px 4px; border: none; border-bottom: 2px solid #888;
      background: transparent; color: #eee; text-transform: uppercase;
      caret-color: #e8b04b; border-radius: 0; }
    #birthday { font-size: 26px; color: #ffd97a; text-align: center; background: rgba(0,0,0,.65);
      border-radius: 14px; padding: 16px 24px; }
    #shmyakRef { position: fixed; top: 96px; left: 50%; transform: translateX(-50%);
      width: min(78vw, 360px); aspect-ratio: 1 / 1; object-fit: contain;
      opacity: .85; pointer-events: none; z-index: 2; display: none;
      padding: 12px; box-sizing: border-box; }
    #selfTestWrap { position: fixed; bottom: 8px; left: 12px; z-index: 6; }
    #errBanner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%);
      z-index: 99; background: rgba(120,0,0,.92); color: #fff; font-size: 15px;
      padding: 16px 20px; border-radius: 12px; display: none; max-width: 90vw;
      white-space: pre-wrap; }
    #selfTestBtn { font-size: 12px; padding: 6px 12px; background: #333; color: #999;
      border: 1px solid #444; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <video id="video" playsinline muted></video>
  <img id="shmyakRef" src="shmyak-contour.png" alt="">
  <div id="dim">Этот свидетель уже найден</div>

  <div id="hud">
    <span id="status"></span>
    <button id="gearBtn">⚙</button>
  </div>

  <div id="settingsPop">
    <div>версия: <span id="verText"></span></div>
    <button id="camBtn">Разрешить камеру заранее</button>
    <button id="resetBtn">Сбросить прогресс</button>
    <button id="closeSettings">Закрыть</button>
  </div>

  <div id="errBanner"></div>

  <div id="nav"></div>

  <div id="panel">
    <div id="hint"></div>
    <button id="playBtn" style="display:none;">▶ Прослушать</button>
    <div id="wordWrap" style="display:none;">
      <div id="cells"></div>
      <input id="wordInput" type="text" autocomplete="off" autocapitalize="characters">
    </div>
    <div id="birthday" style="display:none;">С днём рождения! :*</div>
  </div>

  <div id="selfTestWrap">
  </div>
